<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단가 계산기 (아크릴 / PC)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            font-size: 1.25rem;
            color: #111827;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .result-box {
            margin-top: 24px;
            padding: 16px;
            background-color: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            text-align: center;
        }

        .result-label {
            font-size: 0.875rem;
            color: #0369a1;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0c4a6e;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>맞춤 제작 단가 계산기</h2>
    
    <div class="input-group">
        <label for="material">재질 선택</label>
        <select id="material" onchange="calculate()">
            <option value="15000">아크릴</option>
            <option value="20000">PC (폴리카보네이트)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="width">가로 (mm)</label>
        <input type="number" id="width" placeholder="가로 입력 (mm)" oninput="calculate()">
    </div>

    <div class="input-group">
        <label for="height">세로 (mm)</label>
        <input type="number" id="height" placeholder="세로 입력 (mm)" oninput="calculate()">
    </div>

    <div class="input-group">
        <label for="thickness">두께 (mm)</label>
        <input type="number" id="thickness" placeholder="두께 입력 (mm)" oninput="calculate()">
    </div>

    <div class="result-box">
        <div class="result-label">계산 결과</div>
        <div class="result-value"><span id="result">0</span> 원</div>
    </div>
</div>

<script>
    function calculate() {
        const materialRate = parseFloat(document.getElementById('material').value) || 15000;
        const width = parseFloat(document.getElementById('width').value) || 0;
        const height = parseFloat(document.getElementById('height').value) || 0;
        const thickness = parseFloat(document.getElementById('thickness').value) || 0;

        if (width === 0 || height === 0 || thickness === 0) {
            document.getElementById('result').innerText = '0';
            return;
        }

        // 수식: MAX(1000, CEILING(((가로*세로*두께*1.19)/1000000 * 재질단가 + 500), 200))
        // 아크릴: 15000, PC: 20000
        const rawValue = ((width * height * thickness * 1.19) / 1000000 * materialRate) + 500;

        // 200 단위 올림
        const ceilingValue = Math.ceil(rawValue / 200) * 200;

        // 최소 1000원 보장
        const finalResult = Math.max(1000, ceilingValue);

        document.getElementById('result').innerText = finalResult.toLocaleString();
    }
</script>

</body>
</html>
