<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맞춤 제작 단가 계산기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            font-size: 1.25rem;
            color: #111827;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        /* 라디오 버튼 그룹 스타일 */
        .radio-group {
            display: flex;
            gap: 12px;
        }

        .radio-label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            color: #374151;
            background-color: #ffffff;
            transition: all 0.2s;
        }

        .radio-label input {
            margin-right: 6px;
            accent-color: #2563eb;
        }

        .radio-label:has(input:checked) {
            border-color: #2563eb;
            background-color: #eff6ff;
            color: #1d4ed8;
            font-weight: 600;
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .error-msg {
            display: none;
            color: #dc2626;
            font-size: 0.8rem;
            margin-top: 5px;
            font-weight: 500;
        }

        .result-box {
            margin-top: 24px;
            padding: 16px;
            background-color: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            text-align: center;
        }

        .result-label {
            font-size: 0.875rem;
            color: #0369a1;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0c4a6e;
        }

        .unit-price {
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>맞춤 제작 단가 계산기</h2>
    
    <div class="input-group">
        <label>재질 선택</label>
        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="material" value="15000" checked onchange="calculate()"> 아크릴
            </label>
            <label class="radio-label">
                <input type="radio" name="material" value="20000" onchange="calculate()"> PC (폴리카보네이트)
            </label>
        </div>
    </div>

    <div class="input-group">
        <label for="width">가로 (mm) - 최대 1,500mm</label>
        <input type="number" id="width" max="1500" placeholder="가로 입력 (최대 1500)" oninput="validateAndCalculate('width', 'widthError', 1500)">
        <div class="error-msg" id="widthError">⚠️ 최대 입력 가능 길이는 1,500mm입니다.</div>
    </div>

    <div class="input-group">
        <label for="height">세로 (mm) - 최대 1,500mm</label>
        <input type="number" id="height" max="1500" placeholder="세로 입력 (최대 1500)" oninput="validateAndCalculate('height', 'heightError', 1500)">
        <div class="error-msg" id="heightError">⚠️ 최대 입력 가능 길이는 1,500mm입니다.</div>
    </div>

    <div class="input-group">
        <label for="thickness">두께 (mm) - 최대 10mm</label>
        <input type="number" id="thickness" max="10" placeholder="두께 입력 (최대 10)" oninput="validateAndCalculate('thickness', 'thicknessError', 10)">
        <div class="error-msg" id="thicknessError">⚠️ 최대 입력 가능 두께는 10mm입니다.</div>
    </div>

    <div class="input-group">
        <label for="quantity">수량 (개)</label>
        <input type="number" id="quantity" value="1" min="1" placeholder="수량 입력" oninput="validateQuantity()">
    </div>

    <div class="result-box">
        <div class="result-label">총 견적 금액</div>
        <div class="result-value"><span id="result">0</span> 원</div>
        <div class="unit-price" id="unitPriceText">개당 단가: 0원</div>
    </div>
</div>

<script>
    function validateAndCalculate(inputId, errorId, maxLimit) {
        const inputEl = document.getElementById(inputId);
        const errorEl = document.getElementById(errorId);
        const val = parseFloat(inputEl.value);

        if (val > maxLimit) {
            inputEl.value = maxLimit;
            errorEl.style.display = 'block';
        } else {
            errorEl.style.display = 'none';
        }

        calculate();
    }

    function validateQuantity() {
        const qtyEl = document.getElementById('quantity');
        // 빈칸이 되었을 때(지웠을 때) 자동으로 1로 복원
        if (qtyEl.value === '' || parseFloat(qtyEl.value) < 1) {
            // 사용자가 지우는 중일 수 있으므로 빈칸 상태를 허용하려면 아래 주석 해제 후 처리 가능하나, 
            // 요청하신 대로 지우더라도 자동으로 1이 들어가게 하려면 아래와 같이 처리합니다.
        }
        calculate();
    }

    function calculate() {
        const selectedMaterial = document.querySelector('input[name="material"]:checked');
        const materialRate = selectedMaterial ? parseFloat(selectedMaterial.value) : 15000;

        const width = parseFloat(document.getElementById('width').value) || 0;
        const height = parseFloat(document.getElementById('height').value) || 0;
        const thickness = parseFloat(document.getElementById('thickness').value) || 0;
        
        let quantity = parseInt(document.getElementById('quantity').value);
        if (isNaN(quantity) || quantity < 1) {
            quantity = 1; // 비어있거나 1 미만이면 기본값 1 적용
        }

        if (width === 0 || height === 0 || thickness === 0) {
            document.getElementById('result').innerText = '0';
            document.getElementById('unitPriceText').innerText = '개당 단가: 0원';
            return;
        }

        // 개당 단가 수식: MAX(1000, CEILING(((가로*세로*두께*1.19)/1000000 * 재질단가 + 500), 200))
        const rawValue = ((width * height * thickness * 1.19) / 1000000 * materialRate) + 500;
        const ceilingValue = Math.ceil(rawValue / 200) * 200;
        const unitPrice = Math.max(1000, ceilingValue);

        // 총 금액 = 개당 단가 × 수량
        const totalPrice = unitPrice * quantity;

        document.getElementById('result').innerText = totalPrice.toLocaleString();
        document.getElementById('unitPriceText').innerText = `개당 단가: ${unitPrice.toLocaleString()}원`;
    }
</script>

</body>
</html>
